[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mailtriage"
version = "1.1.0"
description = "Offline e-mail header triage: SPF/DKIM/DMARC, spoofing and look-alike domains, relay path and a risk verdict. JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["phishing", "email-security", "dmarc", "spf"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/mailtriage"

[project.scripts]
mailtriage = "mailtriage:main"

[tool.setuptools]
py-modules = ["mailtriage"]
